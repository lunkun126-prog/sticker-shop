<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff8fc1">
<title>贴纸美容小铺</title>
<style>
:root{
  --pink:#ff7eb6; --pink2:#ffc4de; --pink3:#fff0f7; --aqua:#6fd3f0; --aqua2:#c9f1ff;
  --yellow:#ffe066; --ink:#5a3a4a; --ink2:#8a6878; --ok:#3cc87a; --bad:#ff6b6b;
  --shadow:0 4px 0 rgba(170,70,120,.25); --bg:#ffe3f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;touch-action:manipulation}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#ffd6ea 0%,#e6f7ff 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font-family:inherit;border:none;cursor:pointer;color:var(--ink)}
.btn{background:var(--pink);color:#fff;font-size:20px;font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 5px 0 #d4508e;letter-spacing:1px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d4508e}
.btn.aqua{background:#34b8e0;box-shadow:0 5px 0 #1f8db0}
.btn.yellow{background:#ffc93c;color:#6a4200;box-shadow:0 5px 0 #d99a10}
.btn.gray{background:#cbbac3;box-shadow:0 5px 0 #a8949e}
.btn.green{background:var(--ok);box-shadow:0 5px 0 #25985a}
.btn[disabled]{filter:grayscale(.8);opacity:.55;cursor:default}
.topbar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;z-index:5}
.pill{background:#fff;border-radius:999px;padding:4px 10px 4px 4px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow)}
.pill img{width:26px;height:26px}
.pill .ico{width:26px;height:26px;display:grid;place-items:center;font-size:18px}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;font-size:20px;box-shadow:var(--shadow)}
ruby{ruby-position:over}
rt{font-size:.55em;color:var(--ink2);font-weight:600;letter-spacing:0}
.rw{white-space:nowrap;display:inline-block}
.kw{display:inline-flex;align-items:flex-end;gap:2px;background:var(--yellow);border-radius:10px;padding:0 4px;margin:0 2px;cursor:pointer}
.kw .chip{width:16px;height:16px;border-radius:50%;border:2px solid #fff;margin-bottom:6px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.kw img{width:26px;height:26px;object-fit:contain;margin-bottom:3px}
.en{font-family:"Comic Sans MS","Chalkboard SE","Segoe Print",sans-serif;color:#1f8db0;font-weight:700}
/* 店铺 */
#shop .scene{position:relative;flex:1;overflow:hidden}
#shop .scene .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.decor{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.15));animation:pop .4s}
/* 顾客站在地板上：脚底贴着地面，走进来后原地轻轻摇摆，不再上下飘 */
.door{position:absolute;left:50%;bottom:3%;width:40%;cursor:pointer;transform:translateX(-50%);animation:walkin 1.2s ease-out both}
.door img.who{width:100%;display:block;position:relative;z-index:1;transform-origin:50% 100%;animation:sway 2.4s ease-in-out 1.2s infinite}
.door .shadow{position:absolute;left:18%;right:18%;bottom:-1%;height:5%;border-radius:50%;background:radial-gradient(ellipse,rgba(90,40,60,.35),transparent 70%)}
.door .bang{position:absolute;right:-6px;top:4%;z-index:2;background:#fff;border-radius:16px;padding:4px 10px;font-weight:900;font-size:22px;color:var(--pink);box-shadow:var(--shadow);animation:pulse 1s infinite}
.shopname{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);background:#fff;border:4px solid var(--pink);border-radius:18px;padding:4px 16px;font-weight:900;font-size:22px;white-space:nowrap;box-shadow:var(--shadow)}
.shopname small{display:block;text-align:center;font-size:12px;color:var(--ink2)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -3px 10px rgba(200,80,140,.15);z-index:5}
.nav button{background:var(--pink3);border-radius:16px;padding:6px 0;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button b{font-size:26px;line-height:1.1}
.nav button.main{background:var(--pink);color:#fff}
.daybar{margin:0 10px 4px;background:#fff;border-radius:14px;padding:6px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--pink2);display:block}
.dots i.done{background:var(--pink)}
/* 工作台 */
#work{background:linear-gradient(180deg,#ffe0ef,#dff4ff)}
.stations{display:flex;gap:4px;margin:0 10px 6px;flex-wrap:wrap}
.stn{flex:1;min-width:0;background:#fff;border-radius:12px;padding:4px 2px;font-size:12px;font-weight:800;text-align:center;opacity:.55;border:2px solid transparent}
.stn b{display:block;font-size:20px}
.stn.cur{opacity:1;border-color:var(--pink);box-shadow:var(--shadow)}
.stn.done{opacity:1;background:#e6fff0}
.stn.done::after{content:" ✓";color:var(--ok)}
.orderbar{margin:0 10px;background:#fff;border-radius:18px;padding:6px 10px;box-shadow:var(--shadow);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:44px}
.req{display:flex;align-items:center;gap:3px;background:var(--pink3);border-radius:12px;padding:3px 7px;font-size:14px;font-weight:800;border:2px solid transparent}
.req img{width:26px;height:26px;object-fit:contain}
.req .chip{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.req.ok{border-color:var(--ok);background:#e6fff0}
.req.ok::after{content:"✓";color:var(--ok);font-weight:900;margin-left:2px}
.stagewrap{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0;position:relative}
.stage{position:relative;touch-action:none;flex:none;border-radius:28px;border:5px solid #fff;box-shadow:0 6px 0 rgba(200,80,140,.25);overflow:hidden;
  background:linear-gradient(180deg,#fff6fb 0%,#fff 55%,#ffd6ea 82%,#f7b8d4 100%) center/cover no-repeat}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(230,150,190,.35))}
.stage .foot{position:absolute;left:25%;right:25%;bottom:2.2%;height:4%;border-radius:50%;background:radial-gradient(ellipse,rgba(90,40,60,.3),transparent 70%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.layer{position:absolute;inset:0}
.stk{position:absolute;transform-origin:50% 50%;touch-action:none}
.stk img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.stk.sel{outline:3px dashed var(--pink);outline-offset:3px;border-radius:8px}
.cursor{position:absolute;width:22%;transform:translate(-30%,-70%) rotate(-15deg);pointer-events:none;display:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));z-index:4}
.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:14px;padding:4px 12px;font-weight:800;font-size:16px;box-shadow:var(--shadow);white-space:nowrap;z-index:5}
.tray{background:#fff;border-radius:22px 22px 0 0;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);box-shadow:0 -3px 10px rgba(200,80,140,.15)}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;background:var(--pink3);border-radius:12px;padding:6px 0;font-weight:800;font-size:15px}
.tabs button.on{background:var(--pink);color:#fff}
.items{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;flex-wrap:wrap}
.items::-webkit-scrollbar{display:none}
.item{flex:0 0 auto;width:78px;background:var(--pink3);border-radius:16px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent;font-size:13px;font-weight:800;line-height:1.1;text-align:center;position:relative}
.item img{width:54px;height:54px;object-fit:contain}
.item.on{border-color:var(--pink);background:#ffe0ef}
.item.wrong{animation:shake .4s}
.item .en{font-size:12px}
.item .cnt{position:absolute;right:4px;top:3px;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:0 5px}
.item.big{width:104px}
.item.big img{width:92px;height:92px;object-fit:cover;object-position:50% 70%;border-radius:12px;background:#fff}
.item.shoe img{object-position:50% 96%}
.progress{height:10px;border-radius:999px;background:var(--pink3);overflow:hidden;margin:4px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#7fe0a8,var(--ok));width:0;transition:width .2s}
.partrow{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;margin:2px 0}
.partrow .progress{flex:1}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.small{font-size:13px;color:var(--ink2)}
.selbar{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.selbar button{background:var(--aqua2);border-radius:12px;padding:6px 12px;font-size:18px;font-weight:800}
.nextbar{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
/* 弹窗 */
.modal{position:absolute;inset:0;background:rgba(90,40,70,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.panel{background:#fff;border-radius:26px;padding:18px 16px;width:100%;max-height:92%;overflow:auto;box-shadow:0 8px 0 rgba(200,80,140,.35);text-align:center;animation:pop .3s}
.panel h2{margin:0 0 8px;font-size:24px}
.bubble{background:#fff;border:3px solid var(--pink2);border-radius:22px;padding:10px 14px;font-size:21px;font-weight:800;line-height:2.1;position:relative;text-align:left}
.bubble .en{display:block;font-size:16px;line-height:1.4;margin-top:4px}
.face{width:46%;margin:10px auto 0;display:block}
.stars{font-size:40px;letter-spacing:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts button{background:var(--aqua2);border-radius:18px;padding:14px 0;font-size:32px;font-weight:900;box-shadow:0 4px 0 #8fcfe6}
.opts button.no{background:#eee;color:#bbb;box-shadow:none}
.opts button.yes{background:#b8f5cf;box-shadow:0 4px 0 #6fd39a}
.bill{background:var(--pink3);border-radius:16px;padding:8px 12px;margin:8px 0;font-size:18px;font-weight:800;text-align:left}
.bill div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.bill img{width:30px;height:30px;object-fit:contain}
.coins{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:150px}
.coins img{width:18px;height:18px}
.tenframe{display:inline-grid;grid-template-columns:repeat(5,18px);gap:3px;background:#fff;padding:4px;border-radius:8px;border:2px solid var(--pink2);margin:2px}
.tenframe i{width:18px;height:18px;border-radius:50%;border:2px dashed #eed}
.tenframe i.a{background:var(--pink);border:none}
.tenframe i.b{background:#34b8e0;border:none}
.tenframe i.x{background:#ddd;border:none;position:relative}
.tenframe i.x:after{content:"✕";position:absolute;inset:0;font-size:13px;line-height:18px;color:#999}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.card{background:#fff;border-radius:18px;padding:8px 4px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;gap:2px;position:relative}
.card img{width:60px;height:60px;object-fit:contain}
.card .emo{font-size:44px;line-height:60px;height:60px}
.card .price{background:var(--yellow);border-radius:999px;padding:1px 8px;display:flex;align-items:center;gap:2px}
.card .price img{width:18px;height:18px}
.card.owned{opacity:.55}
.card .big{font-size:40px;line-height:60px;font-weight:900}
.card.miss img{filter:brightness(0) opacity(.18)}
.card .rar{position:absolute;left:6px;top:6px;font-size:11px;border-radius:999px;padding:0 6px;color:#fff}
.rar.r1{background:#b9a6b2}.rar.r2{background:#5aa9ff}.rar.r3{background:linear-gradient(90deg,#ffb300,#ff5fa2)}
.card.shiny{box-shadow:0 0 0 3px #ffd54a,0 4px 0 rgba(170,70,120,.25);animation:glow 1.6s infinite}
.list{flex:1;overflow:auto}
.head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 4px}
.head h1{margin:0;font-size:22px;flex:1}
.photo{position:relative;aspect-ratio:7/9;background:linear-gradient(180deg,#fff,#ffd6ea) center/cover;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow)}
.photo img.l{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.photo .stk{pointer-events:none}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border-radius:20px;padding:12px 20px;font-size:22px;font-weight:900;box-shadow:0 6px 0 rgba(200,80,140,.3);z-index:30;pointer-events:none;animation:toast 1.4s forwards;white-space:nowrap}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.spark{position:absolute;font-size:22px;animation:fly 1s ease-out forwards}
.flash{position:absolute;inset:0;background:#fff;z-index:7;animation:flash .5s forwards;pointer-events:none}
#title{align-items:center;justify-content:center;gap:16px;text-align:center;background:linear-gradient(180deg,#ffc4de,#c9f1ff)}
#title h1{font-size:40px;margin:0;color:#fff;-webkit-text-stroke:2px var(--pink);text-shadow:0 5px 0 var(--pink)}
#title .sub{font-weight:800;color:var(--ink2)}
#title .hero{display:flex;justify-content:center;height:36dvh}
#title .hero img{height:100%;margin:0 -24px}
/* 盲袋 */
.bagbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.bagbox .bagimg{width:180px;cursor:pointer;filter:drop-shadow(0 8px 6px rgba(200,80,140,.3))}
.bagbox .bagimg.shake{animation:bagshake .6s 2}
.reveal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reveal .card{width:120px;animation:pop .5s both}
/* 贴纸小铺 */
#stall .top{position:relative;height:36%;flex:none;overflow:hidden}
#stall .top .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
#stall .buyer{position:absolute;left:4%;bottom:0;height:92%;animation:walkin 1s ease-out both}
#stall .say{position:absolute;right:4%;top:10%;width:56%;background:#fff;border-radius:18px;padding:8px 12px;font-weight:800;font-size:18px;line-height:2;box-shadow:var(--shadow)}
.basket{min-height:62px;background:#fff8e1;border:3px dashed #ffc93c;border-radius:16px;margin:8px;display:flex;gap:6px;align-items:center;padding:6px;flex-wrap:wrap}
.basket img{width:48px;height:48px;object-fit:contain;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes walkin{0%{transform:translateX(90%);opacity:0}60%{opacity:1}100%{transform:translateX(-50%)}}
#stall .buyer{animation-name:walkin2}
@keyframes walkin2{0%{transform:translateX(-80%);opacity:0}100%{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bagshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(40deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #fff)}50%{filter:drop-shadow(0 0 14px #fff6a0)}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.glow{animation:glow 1s 2}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important} }
/* ============ 电脑横屏：舞台占满高度，操作区在右侧 ============ */
@media (min-aspect-ratio: 5/4) and (min-width: 900px){
  #app{max-width:none;background:linear-gradient(135deg,#ffd6ea 0%,#fff0f7 45%,#dff4ff 100%)}
  #title .hero{height:calc(var(--apph,100dvh) * .46)}
  #title h1{font-size:64px}
  #title .sub{font-size:22px}
  #shop.on{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto 1fr;column-gap:24px;padding:16px 24px}
  #shop .topbar{grid-column:1;grid-row:1;padding:0;flex-wrap:wrap}
  #shop .daybar{grid-column:1;grid-row:2;margin:12px 0 0;font-size:18px;flex-wrap:wrap}
  #shop .scene{grid-column:2;grid-row:1/4;height:100%;aspect-ratio:720/1260;flex:none;border-radius:28px;border:6px solid #fff;box-shadow:0 8px 0 rgba(200,80,140,.25)}
  #shop .nav{grid-column:3;grid-row:1/4;align-self:center;grid-template-columns:1fr 1fr;gap:12px;background:none;box-shadow:none;padding:0;max-width:300px}
  #shop .nav button{font-size:18px;padding:12px 0;border-radius:22px;box-shadow:var(--shadow);background:#fff}
  #shop .nav button.main{background:var(--pink);grid-column:1/3}
  #shop .nav button b{font-size:36px}
  .pill{font-size:22px}.pill img,.pill .ico{width:34px;height:34px}
  .iconbtn{width:52px;height:52px;font-size:26px}
  #work.on{display:grid;grid-template-columns:1fr minmax(440px,36%);grid-template-rows:auto auto auto 1fr;column-gap:18px;padding:12px 18px 12px 12px}
  #work .topbar{grid-column:2;grid-row:1;padding:0 0 8px}
  #work .stations{grid-column:2;grid-row:2;margin:0 0 8px}
  #work .stn{font-size:14px}
  #work .orderbar{grid-column:2;grid-row:3;margin:0 0 10px;font-size:18px}
  #work .req{font-size:16px;padding:5px 9px}
  #work .req img{width:32px;height:32px}
  #work .stagewrap{grid-column:1;grid-row:1/5;padding:0}
  #work .tray{grid-column:2;grid-row:4;border-radius:22px;padding:12px;overflow:auto;align-self:stretch;box-shadow:var(--shadow)}
  #work .item{width:104px;font-size:15px}
  #work .item img{width:70px;height:70px}
  #work .item.big{width:124px}
  #work .item.big img{width:110px;height:110px}
  #work .tabs button{font-size:17px;padding:9px 0}
  #work .selbar button{font-size:22px;padding:8px 16px}
  #work .sw{width:46px;height:46px}
  .hint{font-size:20px}
  #store .list,#album .list,#learn .list,#bag .list{width:100%;max-width:1200px;margin:0 auto}
  #store .tabs,#learn .tabs,#bag .tabs{width:100%;max-width:1200px;margin:0 auto}
  .head{width:100%;max-width:1200px;margin:0 auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .card{font-size:16px}.card img{width:90px;height:90px}.card .emo{font-size:64px;line-height:90px;height:90px}
  .card .big{font-size:56px;line-height:80px}
  .panel{max-width:680px}
  #stall.on{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
  #stall .head{grid-column:1/3}
  #stall .top{height:auto;grid-column:1;grid-row:2;margin:0 12px 12px;border-radius:24px}
  #stall .side{grid-column:2;grid-row:2;overflow:auto;padding-right:12px}
  #fsBtn{display:block}
}
#fsBtn{display:none}
</style>
</head>
<body>
<div id="app">

<section class="screen on" id="title">
  <h1>贴纸美容小铺</h1>
  <div class="sub">爆改大变身 · 开店经营 · 盲袋贴纸 · 学拼音、英语和数学</div>
  <div class="hero" id="titleHero"></div>
  <button class="btn" id="startBtn">开 店 啦！</button>

function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); if(id==='work') requestAnimationFrame(fitStage); }
function fitStage(){ const w=$('.stagewrap'), st=$('#stage'); if(!w||!st) return; const W=w.clientWidth*0.96, H=w.clientHeight-8;
  const sw=Math.min(W,H*7/9); st.style.width=sw+'px'; st.style.height=(sw*9/7)+'px'; if(V.ready) V.resize(); }
const LANDSCAPE=matchMedia('(min-aspect-ratio: 5/4) and (min-width: 900px)');
function applyScale(){ const app=$('#app');
  if(!LANDSCAPE.matches){ app.style.zoom=''; app.style.width=''; app.style.height=''; app.style.removeProperty('--apph'); fitStage(); return; }
  const z=Math.max(1,Math.min(innerHeight/760,innerWidth/1350,2.4));
  app.style.zoom=z; app.style.width=(innerWidth/z)+'px'; app.style.height=(innerHeight/z)+'px'; app.style.setProperty('--apph',(innerHeight/z)+'px'); fitStage(); }

// ---- 声音 ----
let voices=[]; function loadVoices(){ try{ voices=speechSynthesis.getVoices(); }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function voiceFor(lang){ const m=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang)); return m.find(v=>/natural|online/i.test(v.name))||m[0]||null; }
function sysSay(parts){ if(!('speechSynthesis' in window)) return; try{ speechSynthesis.cancel();
  for(const [t,l] of parts){ if(!t) continue; const u=new SpeechSynthesisUtterance(t); const zh=l!=='en'; u.lang=zh?'zh-CN':'en-US';
    const v=voiceFor(zh?'zh':'en-us')||voiceFor(zh?'zh':'en'); if(v) u.voice=v; u.rate=zh?1:0.85; speechSynthesis.speak(u); } }catch(e){} }
const TTS_OK=location.protocol.startsWith('http');
let sayToken=0, curAudio=null, speaker=null;  // speaker: 当前说话的顾客 id
function voiceKey(l,who){ if(l==='en') return 'en'; if(who==='c'&&speaker) return CH[speaker]?.boy?'boy':'girl'; return 'narrator'; }
function stopVoice(){ sayToken++; if(curAudio){ try{curAudio.pause()}catch(e){} curAudio=null; } try{speechSynthesis.cancel()}catch(e){} }
// parts: [[文本,'zh'|'en','c'(顾客说的)],...] 依次朗读
function say(parts){ if(S.mute) return; if(!TTS_OK) return sysSay(parts);
  stopVoice(); const tok=sayToken;
  const clips=parts.filter(p=>p[0]).map(([t,l,w])=>{ const a=new Audio('tts?v='+voiceKey(l,w)+'&t='+encodeURIComponent(t)); a.preload='auto'; return {a,t,l}; });
  let i=0; const next=()=>{ if(tok!==sayToken||i>=clips.length) return; const c=clips[i++]; curAudio=c.a;
    c.a.onended=next; c.a.onerror=()=>{ if(tok===sayToken) sysSay([[c.t,c.l]]); }; c.a.play().catch(()=>{}); }; next(); }
let actx=null;
function beep(kind){ if(S.mute) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const notes={ok:[660,880,1320],pop:[520],bad:[300,220],coin:[988,1319],win:[523,659,784,1047],tear:[200,160,120]}[kind]||[600];
  notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; const t=actx.currentTime+i*0.09;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.3); }); }catch(e){} }
function wordSay(w){ say([[w.zh,'zh'],[w.en,'en']]); }

const IMG={};
function loadImg(src){ if(IMG[src]) return IMG[src]; IMG[src]=new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); return IMG[src]; }

// ====================== 角色画布（分部位刮刮卡） ======================
// 底图 = 干净版；每个部位一张「只含该部位脏样子」的透明贴片，孩子擦过的地方（reveal 遮罩）把它抹掉。
const LW=180, LH=231;  // 低分辨率遮罩尺寸（与角色图同比例）
const V = {
  ready:false, cv:null, ctx:null, tmp:null, t2:null, foamPat:null,
  init(){ this.cv=$('#cv'); this.ctx=this.cv.getContext('2d'); this.tmp=document.createElement('canvas'); this.t2=document.createElement('canvas');
    // 泡泡纹理
    const p=document.createElement('canvas'); p.width=p.height=48; const g=p.getContext('2d'); g.fillStyle='rgba(255,255,255,.88)'; g.fillRect(0,0,48,48);
    for(let i=0;i<9;i++){ const x=rnd(4,44), y=rnd(4,44), r=rnd(3,8); g.beginPath(); g.arc(x,y,r,0,7); g.strokeStyle='rgba(150,200,255,.9)'; g.lineWidth=1.5; g.stroke();
      g.beginPath(); g.arc(x-r*.35,y-r*.35,r*.25,0,7); g.fillStyle='#fff'; g.fill(); }
    this.foamPat=p; this.ready=true; this.resize(); },
  resize(){ const st=$('#stage'); if(!st||!this.cv) return; const r=Math.min(2,devicePixelRatio||1);
    const w=Math.round(st.clientWidth*r), h=Math.round(st.clientHeight*r); if(!w||!h) return;
    for(const c of [this.cv,this.tmp,this.t2]){ c.width=w; c.height=h; } this.draw(); },
  draw(){ if(!this.ready||!job||!job.imgs) return; const c=this.ctx, W=this.cv.width, H=this.cv.height, im=job.imgs;
    c.clearRect(0,0,W,H);
    if(job.outfit && im.outfits[job.outfit]) c.drawImage(im.outfits[job.outfit],0,0,W,H);
    else if(job.allClean && im.clean) c.drawImage(im.clean,0,0,W,H);
    else {
      // 干净版打底，各部位的「脏贴片」按 衣服→鞋→头发→脸 盖上去；擦过的地方（reveal）把脏贴片抹掉
      if(im.clean) c.drawImage(im.clean,0,0,W,H);
      for(const p of ['clothes','shoes','hair','face']){ const P=job.parts[p], pi=im.parts[p]; if(!pi||P.st!=='todo') continue;
        this.masked(pi,P.revC); c.drawImage(this.tmp,0,0,W,H);
        if(P.foamC){ const t=this.t2.getContext('2d'); t.globalCompositeOperation='source-over'; t.clearRect(0,0,W,H);
          t.fillStyle=t.createPattern(this.foamPat,'repeat'); t.fillRect(0,0,W,H); t.globalCompositeOperation='destination-in'; t.drawImage(P.foamC,0,0,W,H);
          t.globalCompositeOperation='source-over'; c.drawImage(this.t2,0,0,W,H); } } }
    if(job.shoes && im.shoes[job.shoes]) c.drawImage(im.shoes[job.shoes],0,0,W,H);
    if(job.mk){ c.globalAlpha=.6; c.drawImage(job.mk.c,0,0,W,H); c.globalAlpha=1; } },
  masked(src,maskC){ const t=this.tmp.getContext('2d'), W=this.tmp.width, H=this.tmp.height;
    t.globalCompositeOperation='source-over'; t.clearRect(0,0,W,H); t.drawImage(src,0,0,W,H);
    t.globalCompositeOperation='destination-out'; t.drawImage(maskC,0,0,W,H); t.globalCompositeOperation='source-over'; },
};
// 从贴片的透明度得到低分辨率部位遮罩（需要 http 同源；file:// 下画布被污染就退回整块矩形）
function lowAlpha(im){ const c=document.createElement('canvas'); c.width=LW; c.height=LH; const g=c.getContext('2d'); g.drawImage(im,0,0,LW,LH);
  try{ const d=g.getImageData(0,0,LW,LH).data, a=new Uint8Array(LW*LH); for(let i=0;i<a.length;i++) a[i]=d[i*4+3]; return a; }
  catch(e){ const a=new Uint8Array(LW*LH).fill(255); return a; } }
function arrCanvas(){ const c=document.createElement('canvas'); c.width=LW; c.height=LH; return c; }
function pushArr(c,arr){ const g=c.getContext('2d'), d=g.createImageData(LW,LH); for(let i=0;i<arr.length;i++){ d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=255; d.data[i*4+3]=arr[i]; } g.putImageData(d,0,0); }

let job=null;
function makeJob(cid){
  const d=S.day, c=CH[cid];
  // 脏的部位：主角每次都全脏（爆改！），其他人天数越多越脏
  const all=Object.keys(PARTS); let dirty = cid==='zm' ? all : shuffle(all).slice(0, Math.min(4, d<=1?2:d<=3?3:rnd(3,4)));
  const parts={}; all.forEach(p=>parts[p]={st:dirty.includes(p)?'todo':'clean'});
  const wishes=[];
  if(dirty.includes('shoes')){ if(Math.random()<0.5 && c.shoes.length){ const s=pick(c.shoes); wishes.push({t:'shoes',id:s[0],col:COLOR_BY_ZH[s[1]],style:s[2]}); } else wishes.push({t:'repair'}); }
  const mk=pick(['lipstick','blush','eyeshadow']); wishes.push({t:'makeup',tool:mk,col:pick(mkCols(mk))});
  if(c.outfits.length){ const o=pick(c.outfits); wishes.push({t:'outfit',id:o[0],col:COLOR_BY_ZH[o[1]],style:o[2]}); }
  const nAcc=d<=2?1:2; shuffle(S.stk).slice(0,nAcc).forEach(k=>wishes.push({t:'acc',k,col:STICKERS[k].color&&d>=2?pick(S.col):null}));
  return {cid,parts,wishes,english:d>=3&&Math.random()<0.3,outfit:null,shoes:null,repaired:false,stickers:[],sel:null,
    mk:null,bg:'shop',station:0,imgs:null,allClean:false};
}
function wishText(w){ // [html, 中文, 英文]
  const art=x=>/^[aeiou]/i.test(x)?'an':'a';
  if(w.t==='repair') return [`${ruby('补','bǔ')}${ruby('好','hǎo')}${kw('鞋子','xié zi')}`,'把鞋子补好','fix my shoes'];
  if(w.t==='shoes'){ const c=COLORS[w.col], s=SHOE_STYLES[w.style]; return [`${ruby('一','yì')}${ruby('双','shuāng')}${kw(c.zh,c.py,{sw:c.hex})}${ruby('的','de')}${kw(w.style,s.py)}`,`一双${c.zh}的${w.style}`,`${c.en} ${s.en}`]; }
  if(w.t==='makeup'){ const c=COLORS[w.col], m=MAKEUP[w.tool]; return [`${kw(c.zh,c.py,{sw:c.hex})}${ruby('的','de')}${kw(m.zh,m.py,{icon:img(m.img)})}`,`${c.zh}的${m.zh}`,`${c.en} ${m.en}`]; }
  if(w.t==='outfit'){ const c=COLORS[w.col], s=STYLES[w.style]; return [`${kw(c.zh,c.py,{sw:c.hex})}${ruby('的','de')}${kw(w.style,s.py)}`,`${c.zh}的${w.style}`,`${art(c.en)} ${c.en} ${s.en}`]; }
  const st=STICKERS[w.k]; const c=w.col?COLORS[w.col]:null;
  return [`${c?kw(c.zh,c.py,{sw:c.hex})+ruby('的','de'):''}${kw(st.zh,st.py,{icon:img('s_'+w.k),f:c?c.f:''})}`,`${c?c.zh+'的':''}${st.zh}`,st.plural?`${c?c.en+' ':''}${st.en}`:`${art(c?c.en:st.en)} ${c?c.en+' ':''}${st.en}`];
}
function kw(zh,py,{sw,icon,f}={}){ return `<span class="kw" data-zh="${esc(zh)}">${sw?`<span class="chip" style="background:${sw}"></span>`:''}${icon?`<img src="${icon}" style="${f?'filter:'+f:''}" alt="">`:''}${ruby(zh,py)}</span>`; }
function orderTexts(j){
  const dirty=Object.keys(PARTS).filter(p=>j.parts[p].st==='todo');
  const zhProb=dirty.map(p=>PARTS[p].say).join('');
  const w=j.wishes.map(wishText);
  const zhWish='我还想要'+w.map(x=>x[1]).join('，还有')+'。';
  const enProb=dirty.length?`My ${dirty.map(p=>PARTS[p].en).join(' and ')} ${dirty.length>1||dirty[0]==='shoes'||dirty[0]==='clothes'?'are':'is'} dirty!`:'';
  const enWish='I want '+w.map(x=>x[2]).join(', and ')+'.';
  const html=`<div>${dirty.map(p=>`${kw(PARTS[p].zh,PARTS[p].py)}`).join(' ')} ${ruby('脏','zāng')}${ruby('了','le')}！</div><div>${ruby('我','wǒ')}${ruby('还','hái')}${ruby('想','xiǎng')}${ruby('要','yào')}：${w.map(x=>x[0]).join('、')}</div>`;
  return {html,zh:zhProb+zhWish,en:enProb+' '+enWish};
}
function speakOrder(){ const t=orderTexts(job); speaker=job.cid; if(job.english) say([[t.en,'en','c']]); else say([[t.zh,'zh','c']]); }
function bindKw(root){ root.querySelectorAll('.kw').forEach(k=>k.onclick=e=>{ e.stopPropagation(); const zh=k.dataset.zh;
  const w=Object.values(COLORS).find(c=>c.zh===zh)||Object.values(STICKERS).find(s=>s.zh===zh)||Object.values(MAKEUP).find(s=>s.zh===zh)||Object.values(PARTS).find(s=>s.zh===zh)
    ||(STYLES[zh]&&{en:STYLES[zh].en})||(SHOE_STYLES[zh]&&{en:SHOE_STYLES[zh].en}); say([[zh,'zh'],[w?w.en:'','en']]); }); }
async function startServe(){
  if(S.servedToday>=PER_DAY){ endDay(); return; }
  const cid=nextCust; S.seen=[...new Set([...(S.seen||[]),cid])]; S.lastCust=cid; save();
  job=makeJob(cid); const c=CH[cid], t=orderTexts(job);
  const isNew=c.unlock===S.day&&S.day>1;
  const body= job.english ? `<div class="bubble"><span class="en" style="font-size:21px">${esc(t.en)}</span><div id="zhHint" style="display:none">${t.html}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn gray" id="hintBtn" style="font-size:16px">🀄 看中文</button></div>`
    : `<div class="bubble">${t.html}<span class="en">${esc(t.en)}</span></div>`;
  modal(`<h2>${isNew?'🎉 新顾客 ':''}${ruby(c.name,c.py)} 来啦！</h2>${body}<img class="face" src="${cimg(cid,'messy')}" alt="">
    <div class="row" style="gap:10px;margin-top:8px"><button class="btn aqua" id="againBtn">🔊 再听</button><button class="btn" id="goBtn">开始改造！</button></div>`);
  bindKw($('#panel')); $('#againBtn').onclick=speakOrder;
  if($('#hintBtn')) $('#hintBtn').onclick=()=>{ $('#zhHint').style.display='block'; speaker=cid; say([[t.zh,'zh','c']]); };
  $('#goBtn').onclick=()=>{ closeModal(); beginWork(); };
  setTimeout(speakOrder,250);
  loadJobImages(job);  // 先开始加载
}
async function loadJobImages(j){
  if(j.imgsP) return j.imgsP; const c=CH[j.cid];
  j.imgsP=(async()=>{ const im={messy:await loadImg(cimg(j.cid,'messy')),clean:await loadImg(cimg(j.cid,'clean')),parts:{},outfits:{},shoes:{}};
    for(const p of Object.keys(PARTS)) im.parts[p]=await loadImg(cimg(j.cid,'p_'+p));
    for(const o of c.outfits) im.outfits[o[0]]=await loadImg(cimg(j.cid,'o_'+o[0]));
    for(const s of c.shoes) im.shoes[s[0]]=await loadImg(cimg(j.cid,'s_'+s[0]));
    return im; })();
  return j.imgsP;
}
function stationList(){ const L=[]; const p=job.parts;
  if(['hair','face','clothes'].some(k=>p[k].st==='todo')) L.push('wash');
  if(p.shoes.st==='todo') L.push('shoe');
  L.push('makeup','style','photo','pay'); return L; }
async function beginWork(){
  show('work'); job.imgs=await loadJobImages(job);
  for(const p of Object.keys(PARTS)){ const P=job.parts[p]; if(!job.imgs.parts[p]) { P.st='clean'; continue; }
    P.mask=lowAlpha(job.imgs.parts[p]); P.total=P.mask.reduce((s,v)=>s+(v>40?1:0),0)||1;
    if(P.st==='todo'){ P.rev=new Uint8Array(LW*LH); P.revC=arrCanvas(); P.foam=new Uint8Array(LW*LH); P.foamC=arrCanvas(); P.dry=0; P.prog=0; P.stage=p==='clothes'||p==='shoes'?1:0; } }
  job.list=stationList(); job.station=0;
  if(!V.ready) V.init(); fitStage(); enterStation();
}

const PART_TOOLS={hair:['shampoo','shower','dryer'],face:['facewash','towel'],clothes:['sponge','iron'],shoes:['needle']};
function partStepText(p){ const P=job.parts[p];
  if(P.st==='done'||P.st==='clean') return '✅';
  if(p==='hair') return P.prog<0.9?'洗发水 → 花洒':'吹风机';

function renderWashTray(which='wash'){
  const parts= which==='wash'?['hair','face','clothes']:['shoes'];
  const rows=parts.filter(p=>job.parts[p].st!=='clean').map(p=>{ const P=job.parts[p]; const pct=P.st==='done'?100:Math.round((p==='hair'&&P.prog>=0.9?0.9+0.1*P.dry:P.prog)*100);
    return `<div class="partrow">${ruby(PARTS[p].zh,PARTS[p].py)}<div class="progress"><i style="width:${pct}%"></i></div><span class="small">${partStepText(p)}</span></div>`; }).join('');
  const tools=parts.flatMap(p=>job.parts[p].st==='todo'?PART_TOOLS[p]:[]);
  const done=parts.every(p=>job.parts[p].st!=='todo');
  let extra='';
  if(which==='shoe'){ const c=CH[job.cid];
    extra=`<div class="small" style="margin:6px 0 2px">或者换一双新鞋(${ruby('新','xīn')}${ruby('鞋','xié')} 6 元)：</div><div class="items">${c.shoes.map(([id,cz,sty])=>{ const col=COLORS[COLOR_BY_ZH[cz]];

});

  else if(drag){ const k=job.stickers[drag.i]; k.x=Math.max(0,Math.min(100,p.x-drag.dx)); k.y=Math.max(0,Math.min(100,p.y-drag.dy)); placeSticker(drag.i); } });

function stroke(a,b){ const s=curStation(); if(s==='makeup') return paintMakeup(a,b);
  const seg=Math.hypot((b.x-a.x)*a.w/100,(b.y-a.y)*a.h/100), n=Math.max(1,Math.ceil(seg/6));
  let changed=false, wrong=null;
  for(let k=1;k<=n;k++){ const x=a.x+(b.x-a.x)*k/n, y=a.y+(b.y-a.y)*k/n; const r=brushAt(x,y); if(r===true) changed=true; else if(r) wrong=r; }
  if(changed){ V.draw(); const now=performance.now(); if(now-lastProg>160){ lastProg=now; updateProgress(false); } }
  else if(wrong && !warned){ warned=true; beep('bad'); const tool=TOOLS[job.tool];
    const right=PART_TOOLS[wrong].find(t=>t!==job.tool)||PART_TOOLS[wrong][0];
    setHint(`这里是${ruby(PARTS[wrong].zh,PARTS[wrong].py)}，要用 ${ruby(TOOLS[right].zh,TOOLS[right].py)}`); speaker=null; say([['这里是'+PARTS[wrong].zh+'，要用'+TOOLS[right].zh,'zh']]); }
}
// 在低分辨率遮罩上刷一笔；返回 true=有效、'部位名'=刷到了别的部位、false=什么也没刷到
function brushAt(x,y){ const t=TOOLS[job.tool]; if(!t) return false; const P=job.parts[t.part]; if(!P||P.st!=='todo') return false;
  const cx=x/100*LW, cy=y/100*LH, R=LW*0.075; let hit=false;
  const x0=Math.max(0,Math.floor(cx-R)), x1=Math.min(LW-1,Math.ceil(cx+R)), y0=Math.max(0,Math.floor(cy-R)), y1=Math.min(LH-1,Math.ceil(cy+R));
  for(let yy=y0;yy<=y1;yy++) for(let xx=x0;xx<=x1;xx++){ const d=Math.hypot(xx-cx,yy-cy); if(d>R) continue; const i=yy*LW+xx; if(P.mask[i]<=40) continue; hit=true;
    const f=1-d/R*0.5;
    if(t.act==='foam') P.foam[i]=Math.min(255,P.foam[i]+110*f);
    else if(t.act==='rinse'){ if(P.foam[i]>30){ P.rev[i]=255; P.foam[i]=0; } }
    else if(t.act==='rub') P.rev[i]=Math.min(255,P.rev[i]+120*f);
    else if(t.act==='dry'){ if(P.prog>=0.9) P.dry=Math.min(1,P.dry+0.0009*f); } }
  if(!hit){ // 刷到了别的部位？
    const i=Math.min(LH-1,Math.max(0,Math.round(cy)))*LW+Math.min(LW-1,Math.max(0,Math.round(cx)));
    for(const p of ['face','hair','shoes','clothes']) if(p!==t.part && job.parts[p].st==='todo' && job.parts[p].mask[i]>40) return p;
    return false; }
  if(t.act!=='dry'){ pushArr(P.revC,P.rev); pushArr(P.foamC,P.foam); }
  return true; }
function updateProgress(final){ for(const p of Object.keys(PARTS)){ const P=job.parts[p]; if(P.st!=='todo') continue;
    let n=0; for(let i=0;i<P.mask.length;i++) if(P.mask[i]>40&&P.rev[i]>128) n++; P.prog=n/P.total;
    const need=p==='hair'?P.prog>=0.9&&P.dry>=0.6:P.prog>=0.9;
    if(p==='hair'&&P.prog>=0.9&&!P.rinsed){ P.rinsed=true; P.rev.fill(255); pushArr(P.revC,P.rev); P.foam.fill(0); pushArr(P.foamC,P.foam); speaker=null; say([['冲干净啦！再用吹风机吹干','zh']]); job.tool=null; setHint('💨 用吹风机把头发吹干'); }
    if(need){ P.st='done'; P.rev.fill(255); P.foam.fill(0); if(p==='shoes') job.repaired=true; beep('win'); sparks($('#fx'),50,p==='hair'?15:p==='face'?38:p==='shoes'?92:65,14);
      speaker=null; say([[PARTS[p].zh+'干干净净啦！','zh'],[`Clean ${PARTS[p].en}!`,'en']]); } }
  if(Object.keys(PARTS).every(p=>job.parts[p].st!=='todo')) job.allClean=true;
  V.draw(); renderOrderBar(); renderWashTray(curStation()==='shoe'?'shoe':'wash'); }

function paintMakeup(a,b){ ensureMk(); const g=job.mk.c.getContext('2d'), W=job.mk.c.width, H=job.mk.c.height, Z=zones();

function mathLevel(){ const acc=S.mathTry?S.mathOk/S.mathTry:1; let L=S.day<=2?1:S.day<=4?2:3; if(acc<0.6&&L>1) L--; return L; }
function services(){ const L=[]; for(const p of Object.keys(PARTS)) if(job.parts[p].st==='done'&&!(p==='shoes'&&job.shoes)) L.push({zh:PARTS[p].svc,ico:{hair:'🧴',face:'🧼',clothes:'👕',shoes:'🪡'}[p]});
  if(job.shoes) L.push({zh:'新鞋',ico:'👟'}); if(job.mk&&Object.values(job.mk.amt).some(v=>v>0.1)) L.push({zh:'化妆',ico:'💄'});
  if(job.outfit) L.push({zh:'换装',ico:'👗'}); if(job.stickers.length) L.push({zh:'贴纸',ico:'🎀'}); return L.length?L:[{zh:'洗护',ico:'🧴'}]; }
function makeBill(){ const L=mathLevel(); let items=shuffle(services()); let prices;
  if(L===1){ items=items.slice(0,2); while(items.length<2) items.push(items[0]); const a=rnd(1,5), b=rnd(1,Math.min(5,10-a)); prices=[a,b]; }
  else { items=items.slice(0,3); while(items.length<2) items.push(items[0]); let t; do{ prices=items.map(()=>rnd(2,9)); t=prices.reduce((x,y)=>x+y,0); }while(t>20||t<11); }
  const total=prices.reduce((x,y)=>x+y,0); let paid=null, ans=total;
  if(L===3){ paid=total<10?10:20; if(total===paid) prices[0]--; const t2=prices.reduce((x,y)=>x+y,0); ans=paid-t2; return {L,items:items.map((it,i)=>({...it,price:prices[i]})),total:t2,paid,ans}; }
  return {L,items:items.map((it,i)=>({...it,price:prices[i]})),total,paid,ans}; }
function coinsHtml(n){ return `<span class="coins">${Array.from({length:n},()=>`<img src="img/d_coin.webp" alt="">`).join('')}</span>`; }
function tenFrames(a,b,sub){ let h=''; const tot=sub?a:a+b; const frames=Math.ceil(tot/10)||1;
  for(let f=0;f<frames;f++){ h+='<span class="tenframe">'; for(let i=0;i<10;i++){ const k=f*10+i; let c='';
    if(sub){ if(k<a) c=k>=a-b?'x':'a'; } else { if(k<a) c='a'; else if(k<a+b) c='b'; } h+=`<i class="${c}"></i>`; } h+='</span>'; } return h; }
function askMath({title,rows,question,expr,ans,sayText,help,onDone}){
  const opts=new Set([ans]); for(let d=1;opts.size<4;d++){ for(const v of shuffle([ans-d,ans+d])) if(v>=0&&opts.size<4) opts.add(v); }
  modal(`<h2>${title}</h2>${rows||''}<p style="font-size:19px;font-weight:800">${question}</p><p style="font-size:26px;font-weight:900;margin:4px">${expr} = ?</p>
    <div id="helpBox" style="display:none;margin:4px 0"></div><div class="opts">${shuffle([...opts]).map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn gray" id="helpBtn" style="font-size:16px">💡 帮帮我</button></div>`);
  speaker=null; say([[sayText,'zh']]); let tries=0;
  const showHelp=()=>{ const hb=$('#helpBox'); hb.style.display='block'; hb.innerHTML=help(); };
  $('#helpBtn').onclick=showHelp;
  $$('#panel [data-v]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.v; tries++;
    if(v===ans){ b.classList.add('yes'); beep('coin'); S.mathTry++; if(tries===1) S.mathOk++; say([['答对啦！','zh'],['Great!','en']]); setTimeout(()=>onDone(tries===1),800); }
    else { b.classList.add('no'); b.disabled=true; beep('bad'); say([['再想想','zh']]); if(tries>=2) showHelp(); } }); }
function enterPay(){ setHint(''); $('#tray').innerHTML='<p class="small" style="text-align:center">收银中……</p>'; const bill=makeBill(); job.bill=bill;
  const rows=`<div class="bill">${bill.items.map(it=>`<div><span>${it.ico} ${it.zh}</span>${bill.L===1?coinsHtml(it.price):''}<b>${it.price} 元</b></div>`).join('')}</div>`;
  const expr=bill.L===3?`${bill.paid} − ${bill.total}`:bill.items.map(i=>i.price).join(' + ');
  askMath({title:'💰 收银台',rows,question:bill.L===3?`一共 <b>${bill.total}</b> 元，顾客给了 <b style="color:var(--pink)">${bill.paid}</b> 元。要${ruby('找','zhǎo')}回多少元？`:`一${ruby('共','gòng')}多少元？`,

    let others=shuffle(all.filter(w=>w.zh!==q.zh&&w.en!==q.en&&w.cat===q.cat)).slice(0,2); if(others.length<2) others=shuffle(all.filter(w=>w.zh!==q.zh)).slice(0,2);
    const opts=shuffle([q,...others]);
    const prompt=mode==='char'?`<div style="font-size:60px;font-weight:900">${q.zh}</div><p class="small">这个字是哪个意思？</p>`:mode==='en'?`<p style="font-size:20px;font-weight:800">🔊 听英语，选一选</p><p class="en" style="font-size:28px">${q.en}</p>`
      :`<p style="font-size:20px;font-weight:800">🔊 听一听，选一选</p><div style="font-size:30px;font-weight:900">${ruby(q.zh,q.py)}</div>`;
    modal(`<h2>第 ${qi+1} / 5 题</h2>${prompt}<div class="grid" style="padding:4px">${opts.map((w,i)=>`<div class="card" data-i="${i}">${cardVis(w)}</div>`).join('')}</div><div class="row"><button class="btn aqua" id="qSay" style="font-size:16px">🔊 再听</button></div>`);
    const sayQ=()=>mode==='en'?say([[q.en,'en']]):say([[q.zh,'zh']]); $('#qSay').onclick=sayQ; sayQ(); let first=true;
    $$('#panel .card').forEach(el=>el.onclick=()=>{ const w=opts[+el.dataset.i];
      if(w===q){ if(first) right++; beep('ok'); el.style.background='#b8f5cf'; wordSay(q); setTimeout(()=>{qi++;ask();},1300); } else { first=false; beep('bad'); el.style.opacity=.35; } }); };
  ask(); }

// ====================== 绑定 ======================

$('#navServe').onclick=startServe; $('#door').onclick=startServe;
$('#navStore').onclick=()=>{ show('store'); renderStore(); };
$('#navAlbum').onclick=()=>{ show('album'); renderAlbum(); };
$('#navLearn').onclick=()=>{ show('learn'); renderLearn(); };
$('#navBag').onclick=()=>{ show('bag'); bagTab='open'; renderBag(); };
$('#navStall').onclick=openStall;
$$('#bagTabs button').forEach(b=>b.onclick=()=>{ bagTab=b.dataset.t; renderBag(); });
$$('[data-home]').forEach(b=>b.onclick=goShop);
$$('#storeTabs button').forEach(b=>b.onclick=()=>{ storeTab=b.dataset.t; renderStore(); });
$('#quizBtn').onclick=quiz;
$('#backBtn').onclick=()=>{ modal(`<h2>回到店里？</h2><p>这位顾客会离开哦</p><div class="row" style="gap:10px"><button class="btn gray" id="stay">继续改造</button><button class="btn" id="leave">回店里</button></div>`);
  $('#stay').onclick=closeModal; $('#leave').onclick=()=>{ closeModal(); job=null; goShop(); }; };
$('#orderBtn').onclick=()=>{ if(job) speakOrder(); };
document.addEventListener('fullscreenchange',()=>setTimeout(applyScale,100));
window.addEventListener('resize',applyScale);
try{ new ResizeObserver(()=>fitStage()).observe($('#tray')); }catch(e){}
fetch('img2/chars.json').then(r=>r.json()).then(d=>{ CH=d;
  const hero=['zm','g7','b1'].filter(k=>CH[k]).concat(Object.keys(CH)).slice(0,3);
  $('#titleHero').innerHTML=hero.map(k=>`<img src="${CH[k].outfits.length?cimg(k,'o_'+CH[k].outfits[0][0]):cimg(k,'clean')}" alt="">`).join('');
}).catch(()=>{ $('#titleHero').innerHTML='<p class="small">没读到角色表 img2/chars.json（要从桌面图标或 Launchpad 打开）</p>'; });
applyScale();
</script>
